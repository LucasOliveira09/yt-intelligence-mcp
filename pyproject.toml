[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-intelligence-mcp"
version = "1.0.0"
description = "Self-hosted YouTube Intelligence & Channel Management Model Context Protocol (MCP) server. A free, quota-safe vidIQ alternative for AI agents."
readme = "README.md"
authors = [
  { name = "Lucas Leite de Oliveira" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.3.0,<2.0.0",
  "google-api-python-client>=2.150.0",
  "google-auth-oauthlib>=1.2.1",
  "google-auth-httplib2>=0.2.0",
  "scrapetube>=2.6.0",
  "yt-dlp>=2025.1.0",
  "youtube-transcript-api>=1.2.5",
  "typer>=0.15.0",
  "rich>=13.9.0",
  "pydantic>=2.10.0",
  "requests>=2.32.0"
]

[project.scripts]
yt-intel = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
